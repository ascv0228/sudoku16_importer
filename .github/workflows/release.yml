name: Import 16x16 Sudoku Base Dataset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Download upstream 16x16 base puzzles only
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/zayenz/scaled-sudoku-instances.git upstream
          cd upstream
          git sparse-checkout set base/16x16 LICENSE
          git rev-parse HEAD > ../source_commit.txt
      - name: Build and validate dataset
        run: |
          python3 scripts/build.py --source upstream/base/16x16 --out dist --source-commit "$(cat source_commit.txt)"
          cp upstream/LICENSE dist/UPSTREAM_LICENSE.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dataset-$(cut -c1-12 source_commit.txt)"
          gh release create "$TAG" dist/base16.bin dist/manifest.json dist/UPSTREAM_LICENSE.txt \
            --title "16x16 Sudoku base ($TAG)" \
            --notes "10,000 upstream unique-solution base puzzles; see manifest.json for SHA-256 and source commit." \
            --latest
